<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img"><title>Lap times</title><style>
:root{--bg:#ffffff;--pan:#f4f6f8;--fg:#1b1d21;--mut:#6b7178;--grid:#dfe3e8;
--warn:#c8384b;--ok:#1f8a7d;--acc:#3f6fd0;--halo:#ffffff;
--charge:#1f8a45;--repair:#7b3fcf;--crash:#d1303f}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--pan:#1c1f25;--fg:#e7e9ec;
--mut:#8b9199;--grid:#2b3037;--warn:#ef6d7d;--ok:#4fbfae;--acc:#7aa2f7;--halo:#14161a;
--charge:#4cc97a;--repair:#a98bf0;--crash:#f0524d}}
text{font-family:'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.mut{fill:var(--mut)}
.ttl{font-weight:600}
.grid{stroke:var(--grid);stroke-width:1;fill:none}
.axis{stroke:var(--mut);stroke-width:1;fill:none;opacity:.5}
.pan{fill:var(--pan)}
</style><rect width="980" height="330" fill="var(--bg)"/><text x="14" y="26" font-size="15" text-anchor="start" class="ttl" >Lap times</text><rect x="104" y="56" width="624.84" height="22" rx="4" fill="var(--ok)" opacity="0.45"/><text x="94" y="71.5" font-size="11" text-anchor="end" class="mut" >best ever</text><text x="738.84" y="71.5" font-size="10.5" text-anchor="start" class="mut" >0:22.350</text><rect x="104" y="114" width="732.47" height="26" rx="4" class="pan"/><rect x="104" y="114" width="732.47" height="26" rx="4" fill="var(--acc)" opacity="0.32"/><text x="94" y="131.5" font-size="11" text-anchor="end" class="" >lap 1</text><text x="846.47" y="131.5" font-size="10.5" text-anchor="start" class="" >0:26.184</text><text x="104" y="158" font-size="10" text-anchor="start" class="mut" >0.0 s under 10 km/h in 0 stalls</text><rect x="104" y="172" width="749.25" height="26" rx="4" class="pan"/><rect x="104" y="172" width="749.25" height="26" rx="4" fill="var(--acc)" opacity="0.32"/><text x="94" y="189.5" font-size="11" text-anchor="end" class="" >lap 2</text><text x="863.25" y="189.5" font-size="10.5" text-anchor="start" class="" >0:26.834</text><text x="104" y="216" font-size="10" text-anchor="start" class="mut" >0.0 s under 10 km/h in 0 stalls</text><rect x="104" y="230" width="780" height="26" rx="4" class="pan"/><rect x="104" y="230" width="780" height="26" rx="4" fill="var(--acc)" opacity="0.32"/><text x="94" y="247.5" font-size="11" text-anchor="end" class="" >lap 3</text><text x="894" y="247.5" font-size="10.5" text-anchor="start" class="" >0:27.934</text><text x="104" y="274" font-size="10" text-anchor="start" class="mut" >0.0 s under 10 km/h in 0 stalls</text><text x="14" y="318" font-size="10" text-anchor="start" class="mut" >Red is time spent below 10 km/h. It is the cheapest time on the track to get back.</text></svg>